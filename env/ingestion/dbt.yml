# DataHub ingestion recipe for the demo dbt project. OWNER B (@teammate).
#
# Run with:
#   uv run datahub ingest -c env/ingestion/dbt.yml
#
# The one setting that matters for this project is column-level lineage. If the
# dbt source does not emit fine-grained lineage, blast-radius has nothing to be
# grounded in and the demo demonstrates nothing. env/seed_demo.py asserts that
# fine-grained lineage was actually emitted rather than assuming it.
#
# Verified against acryl-datahub 1.6.0.17 on a live quickstart: every key below
# is accepted and `fineGrainedLineages` is emitted for all five models.
# env/seed_demo.py re-checks the lineage after every ingest rather than trusting
# this comment, because a key a later release renames is ignored silently.

source:
  type: dbt
  config:
    manifest_path: env/dbt_project/target/manifest.json
    catalog_path: env/dbt_project/target/catalog.json
    # The build's run results, parked here by env/seed_demo.py because
    # `dbt docs generate` overwrites run_results.json with a docs run that this
    # source discards. Keep the name in step with RUN_RESULTS_COPY there.
    run_results_paths:
      - env/dbt_project/target/run_results.build.json
    target_platform: duckdb

    # Pinned rather than left to the default, which the source warns is due to
    # change. URNs are the join key between everything this project does: the
    # extractor builds them from the manifest, the engine looks them up, the
    # seeded governance metadata hangs off them. A default that flips between
    # releases would silently disconnect all three.
    convert_urns_to_lowercase: false

    # Column-level lineage. Non-negotiable for this project.
    include_column_lineage: true

    # Bring dbt descriptions and meta across, because they are part of the
    # threat model: DataHub documentation is an untrusted-text source for
    # blast-radius exactly like a diff description is.
    enable_meta_mapping: true

    entities_enabled:
      test_results: true
      model_performance: false

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL:-http://localhost:8080}"
    token: "${DATAHUB_GMS_TOKEN:-}"
